name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore RunTrack.Api/RunTrack.Api.csproj
      - run: dotnet build RunTrack.Api/RunTrack.Api.csproj -c Release --no-restore

  web:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RunTrack.Front/runtrack-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: RunTrack.Front/runtrack-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
